<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <rect width="800" height="500" fill="#080A0E"/>
  
  <!-- Subtle Industrial Grid -->
  <defs>
    <pattern id="grid-wire" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18202A" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow-wire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#080A0E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#grid-wire)"/>
  <rect width="800" height="500" fill="url(#glow-wire)"/>
  
  <!-- Outer Technical Border & Corner Brackets -->
  <rect x="24" y="24" width="752" height="452" stroke="#253040" stroke-width="1.5" stroke-dasharray="8 6"/>
  
  <!-- Corner Crosshairs -->
  <path d="M 20 34 L 20 20 L 34 20" stroke="#D97706" stroke-width="2.5" fill="none"/>
  <path d="M 780 34 L 780 20 L 766 20" stroke="#D97706" stroke-width="2.5" fill="none"/>
  <path d="M 20 466 L 20 480 L 34 480" stroke="#D97706" stroke-width="2.5" fill="none"/>
  <path d="M 780 466 L 780 480 L 766 480" stroke="#D97706" stroke-width="2.5" fill="none"/>
  
  <!-- Center Wire Coil Technical Illustration -->
  <g transform="translate(400, 190)" stroke="#94A3B8" stroke-width="2">
    <!-- Concentric wire rings -->
    <ellipse cx="0" cy="0" rx="90" ry="45" fill="none" stroke="#475569" stroke-width="3"/>
    <ellipse cx="0" cy="-6" rx="84" ry="42" fill="none" stroke="#64748B" stroke-width="2"/>
    <ellipse cx="0" cy="-12" rx="78" ry="39" fill="none" stroke="#D97706" stroke-width="2.5"/>
    <ellipse cx="0" cy="-18" rx="72" ry="36" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <ellipse cx="0" cy="-24" rx="66" ry="33" fill="none" stroke="#CBD5E1" stroke-width="2.5"/>
    <!-- Wire tie cross-straps -->
    <line x1="-50" y1="-30" x2="-35" y2="20" stroke="#D97706" stroke-width="3"/>
    <line x1="50" y1="-30" x2="35" y2="20" stroke="#D97706" stroke-width="3"/>
    <line x1="-5" y1="-40" x2="0" y2="25" stroke="#D97706" stroke-width="3"/>
  </g>
  
  <!-- Category Status Badge -->
  <g transform="translate(400, 275)">
    <rect x="-140" y="-14" width="280" height="28" fill="#12161C" stroke="#D97706" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Archivo', sans-serif" font-size="11" font-weight="800" fill="#D97706" text-anchor="middle" letter-spacing="2">
      PHOTO PENDING // AWAITING YARD UPLOAD
    </text>
  </g>
  
  <!-- Product Label Heading -->
  <text x="400" y="340" font-family="'Archivo', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    ANNEALED BINDING WIRE COILS
  </text>
  
  <!-- Description & Specifications -->
  <text x="400" y="375" font-family="'Public Sans', sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle" letter-spacing="0.5">
    18 &amp; 20 Gauge Dead-Soft Annealed • 25kg / 50kg Bundles Stocked in Depot
  </text>
  
  <!-- Yard Stock Stamp -->
  <text x="400" y="445" font-family="'Courier New', monospace" font-size="10" fill="#64748B" text-anchor="middle" letter-spacing="3">
    SHREE SHIV CONSTRUCTION &amp; STEEL • 200 FEET ROAD DEPOT
  </text>
</svg>
